  /* ===== 液态玻璃（原样） ===== */
  .liquid-glass {
    background: rgba(255,255,255,0.01);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .liquid-glass-strong {
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.2) 80%, rgba(255,255,255,0.5) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ===== 深空兜底（视频加载成功时看不见） ===== */
  .space-fallback {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 35%, #0a0e1a 0%, #050608 55%, #000 100%);

<script type="text/babel" data-presets="react">

  /* ===== FadingVideo：rAF 逐帧淡变，loop 属性关闭，ended 后 100ms 重置重播 ===== */
  function FadingVideo({ src, style }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const v = ref.current;
      if (!v) return;
      const FADE_MS = 500;
      let raf;
      const tick = () => {
        if (v.duration && !isNaN(v.duration)) {
          const remaining = v.duration - v.currentTime;
          if (remaining <= 0.55) {
            // 距结束 0.55s 开始淡出（约 550ms ≈ FADE_MS），露出深空兜底
            v.style.opacity = String(Math.max(0, remaining / 0.55));
          } else if (v.style.opacity !== '1' && v.style.opacity !== '') {
            v.style.opacity = '1';
          }
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      const onEnded = () => {
        setTimeout(() => {
          try { v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
        }, 100);
      };
      v.addEventListener('ended', onEnded);
      return () => { cancelAnimationFrame(raf); v.removeEventListener('ended', onEnded); };
    }, []);
    return (
      <video ref={ref} className="bg-video no-transition" style={Object.assign({ opacity: 1 }, style)}
        autoPlay muted playsInline preload="auto" src={src} />
    );
  }

  /* ===== BlurText：IntersectionObserver 触发，按空格逐词模糊入场 ===== */
  function BlurText({ text, className }) {
    const ref = React.useRef(null);
    const [inView, setInView] = React.useState(false);
    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } });
      }, { threshold: 0.1 });
      obs.observe(el);
      return () => obs.disconnect();
    }, []);
    const words = text.split(' ');
    return (
      <span ref={ref} className={className} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '0.22em', lineHeight: 1.12 }}>
        {words.map((w, i) => (
          <motion.span
            key={i}
            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
            animate={inView ? { filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'], opacity: [0, 0.5, 1], y: [50, -5, 0] } : {}}
            transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: i * 0.1 }}
            style={{ display: 'inline-block', whiteSpace: 'nowrap' }}
          >
            {w}
          </motion.span>
        ))}
      </span>
    );
  }

  /* ===== 通用区块入场：initial blur(10)+opacity0+y20，easeOut，可设 delay ===== */
  function Reveal({ children, delay = 0, className }) {
    return (
      <motion.div
        initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
        animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
        transition={{ duration: 0.8, ease: 'easeOut', delay }}
        className={className}
      >
        {children}
      </motion.div>
    );
  }

  /* ===== 图标 ===== */
  function Icon({ name }) {
    const c = { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.6, strokeLinecap: 'round', strokeLinejoin: 'round' };
    if (name === 'lightbulb') return (<svg {...c}><path d="M9 18h6" /><path d="M10 22h4" /><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z" /></svg>);
    if (name === 'image') return (<svg {...c}><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-5-5L5 21" /></svg>);
    return (<svg {...c}><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4" /></svg>);
  }

  const CAPS = [
    {
      icon: 'lightbulb',
      title: 'AI 零代码实战',
      desc: '从提示词到网站、小程序，手把手带零基础女性做出第一个属于自己的数字作品。',

          {/* 主体居中 */}
          <div className="relative z-10 h-full flex flex-col items-center justify-center text-center px-6">
            <Reveal delay={0.4} className="mb-7">
              <span className="liquid-glass rounded-full px-5 py-2 text-xs tracking-wider text-white/85">海南省妇联女性 AI 学习圈 · 进阶班 7/25 开课</span>
            </Reveal>

            <h1 className="font-heading text-[13vw] md:text-[64px] lg:text-[88px] leading-[1.05] max-w-4xl">
              <BlurText text="用 AI 与 心理学 陪 你 长出 力量" />
            </h1>

            <Reveal delay={0.8} className="mt-7">

            </Reveal>

            <Reveal delay={1.1} className="mt-9 flex flex-wrap gap-4 justify-center">

            </Reveal>

            <Reveal delay={1.3} className="mt-11 flex flex-wrap gap-5 justify-center">
              <div className="liquid-glass rounded-3xl px-7 py-5 text-center">
                <div className="font-heading text-4xl">1000+</div>
                <div className="text-xs text-white/70 mt-1">女性学员 已用 AI 提效</div>

              <div className="liquid-glass rounded-3xl px-7 py-5 text-center">

            </Reveal>
          </div>

          {/* 底部合作伙伴 */}
          <Reveal delay={1.4} className="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-[92%] max-w-5xl">
            <div className="flex flex-wrap items-center justify-center gap-x-7 gap-y-2 text-xs text-white/55">
              {['海南省妇联', '海口人力资源服务产业园', '女性成长联盟', 'AI 教育实验室', '心理咨询中心'].map((p) => (<span key={p}>{p}</span>))}
            </div>
          </Reveal>
        </section>

        {/* ============ 第二屏 Capabilities ============ */}
        <section id="cap" className="relative w-full min-h-screen overflow-hidden bg-black">
          <div className="space-fallback"></div>
          <div className="stars"></div>
          <FadingVideo
            src={CAP_VIDEO}
            style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center' }}

          <div className="relative z-10 px-6 md:px-16 py-24 max-w-6xl mx-auto">

            <div className="grid md:grid-cols-3 gap-6">

              ))}

    );
  }

</script>

  .pz-item{position:relative;margin:0;border-radius:16px;overflow:hidden;background:rgba(128,128,128,.06);box-shadow:0 14px 34px -20px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s;cursor:zoom-in}
  .pz-item:hover{transform:translateY(-8px);box-shadow:0 30px 56px -24px rgba(0,0,0,.6)}
  .pz-item img{width:100%;height:auto;display:block}
  .pz-cap{position:absolute;left:12px;bottom:12px;font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.42);padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px);font-family:"JetBrains Mono",monospace}
  @media(max-width:600px){.pz-grid{grid-template-columns:repeat(2,1fr);gap:12px}.pz-item{border-radius:12px}}
  
/* ===== 实训现场 · 12 张真实照片墙 ===== */
.sx-sec{border-top:1px solid rgba(128,128,128,.16)}
.sx-grid{margin-top:6px}
.sx-grid .pz-item img{aspect-ratio:4 / 3;object-fit:cover;height:auto}
.sx-grid .pz-cap{max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.sx-grid{grid-template-columns:1fr}}
</style>
